server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Rede privada IPv6 (.railway.internal) não alcança o Spring neste setup.
        # Proxy público evita 504 no cadastro/login.
        proxy_pass https://api-registro-financeiro-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host api-registro-financeiro-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Evita 403 Invalid CORS request: o browser manda Origin do front,
        # mas o CORS da API só liberava localhost.
        proxy_set_header Origin "";
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
