<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5cad" />
    <title>Registros Financeiros</title>
    <!--
      Anti-FOUC: define o tema antes do primeiro paint. Precisa ser inline e
      síncrono — se esperar o bundle, a tela pisca branca no tema escuro.
      A chave 'theme' espelha THEME_STORAGE_KEY em src/constants/theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
